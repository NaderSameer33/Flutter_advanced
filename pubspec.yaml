name: flutter_advanced
description: "A new Flutter project."

publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.12.2


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8

  get_it: ^9.2.1
  flutter_bloc: ^9.1.1
  freezed: ^3.2.5
  dio: ^5.11.0
  retrofit: ^4.10.0
  retrofit_generator: ^10.2.9
  freezed_annotation: ^3.1.0
  json_serializable: ^6.14.1
  json_annotation: ^4.12.0
  pretty_dio_logger: ^1.4.0
  flutter_native_splash: ^2.4.8
  easy_localization: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0


